[project]
name = "eide"
version = "3.0.0a1"
description = "EIDE — Embedded IDE co tac tu (agent loop core). Thiet ke: EIDE-MDD-40 v3.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "websockets>=12.0",
    # ING-B — bộ đọc Office. Ba thư viện thuần Python, không cần Office cài trên máy.
    # Định dạng đời cũ (.doc/.xls/.ppt) cần LibreOffice, nhưng đó là TUỲ CHỌN: thiếu nó
    # thì sản phẩm nói rõ và đề nghị lưu lại ở định dạng mới, không lỗi cứng.
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    # ING-E — OCR. Cả hai TUỲ CHỌN về mặt hành vi: thiếu tesseract hoặc thiếu gói ngôn
    # ngữ thì sản phẩm NÓI RÕ và từ chối đọc, chứ không OCR bằng gói sai.
    "pytesseract>=0.3",
    "pillow>=10.0",
    # SCH-B — đọc/ghi .kicad_sch. Thư viện Python THUẦN, KHÔNG phải KiCad: quyết định
    # 25/09/2026 cấm cài KiCad, không cấm đọc định dạng của nó. Chọn nó thay vì tự viết vì
    # round-trip .kicad_sch là chỗ dễ sai LẶNG LẼ nhất (một trường bị bỏ khi ghi lại thì
    # KiCad vẫn mở được tệp nhưng mất thông tin), và SCH-44 §3 bước 5 đòi đúng phép kiểm
    # "kiutils parse lại được".
    "kiutils>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
eide-core = "eide.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eide = ["rules/*.yaml", "policy/*.yaml", "context/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
