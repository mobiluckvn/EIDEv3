[project]
name = "eide"
version = "3.0.0a1"
description = "EIDE — Embedded IDE co tac tu (agent loop core). Thiet ke: EIDE-MDD-40 v3.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "websockets>=12.0",
    # ING-B — bộ đọc Office. Ba thư viện thuần Python, không cần Office cài trên máy.
    # Định dạng đời cũ (.doc/.xls/.ppt) cần LibreOffice, nhưng đó là TUỲ CHỌN: thiếu nó
    # thì sản phẩm nói rõ và đề nghị lưu lại ở định dạng mới, không lỗi cứng.
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
eide-core = "eide.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eide = ["rules/*.yaml", "policy/*.yaml", "context/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
