<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#333333"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="500" y="40" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a">Năng suất (đo được, so với ước lượng người làm tay)</text><rect x="40" y="60" width="290" height="110" rx="10" fill="#eef2f7" stroke="#333333" stroke-width="3"/><text x="185.0" y="97.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a1a">Thời gian</text><text x="185.0" y="124.60000000000001" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">giờ của một người</text><text x="185.0" y="150.60000000000002" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">so với ngày công một đội</text><rect x="355" y="60" width="290" height="110" rx="10" fill="#eef2f7" stroke="#333333" stroke-width="3"/><text x="500.0" y="97.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a1a">Tiền</text><text x="500.0" y="124.60000000000001" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">tiền mô hình so với</text><text x="500.0" y="150.60000000000002" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">lương đội (PERT, COCOMO)</text><rect x="670" y="60" width="290" height="110" rx="10" fill="#fdf3e1" stroke="#333333" stroke-width="3"/><text x="815.0" y="97.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a1a">Điều kiện</text><text x="815.0" y="124.60000000000001" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">phần việc nằm trong máy</text><text x="815.0" y="150.60000000000002" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">so với phần chạm vật thật</text><text x="500" y="210" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a">Năng lực (ba thước, đếm được từ sổ ghi việc)</text><rect x="40" y="230" width="290" height="150" rx="10" fill="#e8f3ea" stroke="#333333" stroke-width="3"/><text x="185.0" y="274.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a1a">1. Làm đủ bước</text><text x="185.0" y="301.59999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">phép đo, lần đọc ngược,</text><text x="185.0" y="327.59999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">điều kiện đối chiếu lại,</text><text x="185.0" y="353.59999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">changeset gỡ lại được</text><rect x="355" y="230" width="290" height="150" rx="10" fill="#e8f3ea" stroke="#333333" stroke-width="3"/><text x="500.0" y="274.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a1a">2. Vào vùng mới</text><text x="500.0" y="301.59999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">công cụ tự viết, tự kiểm;</text><text x="500.0" y="327.59999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">việc ngoài vùng từng làm</text><text x="500.0" y="353.59999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">đi được tới bo thật</text><rect x="670" y="230" width="290" height="150" rx="10" fill="#e8f3ea" stroke="#333333" stroke-width="3"/><text x="815.0" y="274.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a1a">3. Tự khai điểm mù</text><text x="815.0" y="301.59999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">điểm mù khai trước rồi</text><text x="815.0" y="327.59999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">nổ đúng chỗ; nhận sai</text><text x="815.0" y="353.59999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">trước khi bị truy</text><text x="500" y="440" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a">Chiều bắt lỗi (đếm từ nhật ký hai phiên cùng đề bài)</text><rect x="60" y="460" width="420" height="120" rx="10" fill="#ffffff" stroke="#333333" stroke-width="3"/><text x="270.0" y="501.1" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a1a">Lỗi tác tử do người bắt</text><text x="270.0" y="529.3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#1a1a1a">phép đo người thiết kế,</text><text x="270.0" y="556.5999999999999" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#1a1a1a">người đọc mã rồi hỏi lại</text><rect x="520" y="460" width="420" height="120" rx="10" fill="#ffffff" stroke="#333333" stroke-width="3"/><text x="730.0" y="501.1" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a1a">Lỗi người do tác tử bắt</text><text x="730.0" y="529.3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#1a1a1a">tác tử bác kết luận sai,</text><text x="730.0" y="556.5999999999999" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#1a1a1a">tìm lỗ trong phép đo của người</text><line x1="480" y1="515" x2="520" y2="515" stroke="#333333" stroke-width="3" marker-end="url(#ah)"/><line x1="520" y1="540" x2="480" y2="540" stroke="#333333" stroke-width="3" marker-end="url(#ah)"/><text x="500" y="640" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a">Mức lợi tỉ lệ với phần việc nằm trong máy tính</text><path d="M 80 760 L 920 760" fill="none" stroke="#333333" stroke-width="3" marker-end="url(#ah)"/><text x="80" y="800" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#444" font-style="italic">ít (gỡ lỗi trên bo, cần người dựng robot)</text><text x="920" y="800" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="end" fill="#444" font-style="italic">nhiều (đọc tài liệu, tra thanh ghi, viết mã)</text><text x="500" y="840" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#444" font-style="italic">phần việc nằm trong máy tính →</text><rect x="90" y="680" width="220" height="56" rx="28" fill="#fdf3e1" stroke="#333333" stroke-width="3"/><text x="200.0" y="715.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a">Robot</text><text x="200" y="746" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1a1a1a"></text><circle cx="200" cy="760" r="9" fill="#333"/><text x="200" y="890" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#444" font-style="italic">giờ chênh ≈ 33–57 lần</text><rect x="390" y="680" width="220" height="56" rx="28" fill="#fdf3e1" stroke="#333333" stroke-width="3"/><text x="500.0" y="715.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a">FPGA</text><text x="500" y="746" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1a1a1a"></text><circle cx="500" cy="760" r="9" fill="#333"/><text x="500" y="890" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#444" font-style="italic">chưa ước lượng người</text><rect x="690" y="680" width="220" height="56" rx="28" fill="#fdf3e1" stroke="#333333" stroke-width="3"/><text x="800.0" y="715.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a">Nhân RTOS</text><text x="800" y="746" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1a1a1a"></text><circle cx="800" cy="760" r="9" fill="#333"/><text x="800" y="890" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#444" font-style="italic">giờ chênh ≈ 190 lần</text><rect x="60" y="930" width="880" height="160" rx="10" fill="#fdf3e1" stroke="#333333" stroke-width="3"/><text x="500.0" y="979.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a1a">Điều kiện quyết định: chất lượng đề bài do người viết</text><text x="500.0" y="1006.6" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">Tác tử làm đúng theo tiêu chí sai, nhanh và triệt để.</text><text x="500.0" y="1032.6" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">Ba tiêu chí viết lỏng → 24 ô đo không thể báo sai,</text><text x="500.0" y="1058.6" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">36 dòng mã không ai gọi, một bản nạp chậm 11 lần mà không ai biết</text></svg>