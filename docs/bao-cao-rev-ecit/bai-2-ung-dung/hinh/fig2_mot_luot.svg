<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#333333"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="60" y="40" width="560" height="100" rx="10" fill="#fdf3e1" stroke="#333333" stroke-width="3"/><text x="340.0" y="84.8" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a">1. Kỹ sư gõ một câu</text><text x="340.0" y="114.6" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#1a1a1a">ví dụ: “viết lại nhân thời gian thực”</text><line x1="340.0" y1="140" x2="340.0" y2="190" stroke="#333333" stroke-width="3" marker-end="url(#ah)"/><rect x="60" y="190" width="560" height="100" rx="10" fill="#ffffff" stroke="#333333" stroke-width="3"/><text x="340.0" y="234.8" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a">2. Lõi dựng ngữ cảnh từ kho</text><text x="340.0" y="264.6" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#1a1a1a">yêu cầu, tài liệu đã nạp, thông số, lịch sử</text><line x1="340.0" y1="290" x2="340.0" y2="340" stroke="#333333" stroke-width="3" marker-end="url(#ah)"/><rect x="60" y="340" width="560" height="100" rx="10" fill="#e8f3ea" stroke="#333333" stroke-width="3"/><text x="340.0" y="384.8" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a">3. Mô hình chọn một công cụ</text><text x="340.0" y="414.6" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#1a1a1a">hoặc quyết định trả lời</text><line x1="340.0" y1="440" x2="340.0" y2="490" stroke="#333333" stroke-width="3" marker-end="url(#ah)"/><rect x="60" y="490" width="560" height="100" rx="10" fill="#ffffff" stroke="#333333" stroke-width="3"/><text x="340.0" y="534.8" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a">4. Ba lớp chặn kiểm lời gọi</text><text x="340.0" y="564.5999999999999" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#1a1a1a">luật → cửa duyệt → hộp cát / nguồn số</text><line x1="340.0" y1="590" x2="340.0" y2="640" stroke="#333333" stroke-width="3" marker-end="url(#ah)"/><rect x="60" y="640" width="560" height="100" rx="10" fill="#ffffff" stroke="#333333" stroke-width="3"/><text x="340.0" y="684.8" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a">5. Chạy công cụ, ghi vào sổ</text><text x="340.0" y="714.5999999999999" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#1a1a1a">tham số, kết quả, mã lỗi; sửa tệp → changeset</text><line x1="340.0" y1="740" x2="340.0" y2="790" stroke="#333333" stroke-width="3" marker-end="url(#ah)"/><rect x="60" y="790" width="560" height="100" rx="10" fill="#ffffff" stroke="#333333" stroke-width="3"/><text x="340.0" y="834.8" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a">6. Kết quả quay về mô hình</text><text x="340.0" y="864.5999999999999" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#1a1a1a">kể cả lỗi và lời từ chối, dưới dạng dữ liệu</text><line x1="340.0" y1="890" x2="340.0" y2="940" stroke="#333333" stroke-width="3" marker-end="url(#ah)"/><rect x="60" y="940" width="560" height="100" rx="10" fill="#ffffff" stroke="#333333" stroke-width="3"/><text x="340.0" y="984.8" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a">7. Kiểm trước khi kết thúc lượt</text><text x="340.0" y="1014.5999999999999" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#1a1a1a">giả định? sửa của người? việc chưa kiểm?</text><line x1="340.0" y1="1040" x2="340.0" y2="1090" stroke="#333333" stroke-width="3" marker-end="url(#ah)"/><rect x="60" y="1090" width="560" height="100" rx="10" fill="#fdf3e1" stroke="#333333" stroke-width="3"/><text x="340.0" y="1134.8" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a">8. Trả lời; 11 tab vẽ lại từ kho</text><text x="340.0" y="1164.6" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#1a1a1a">mọi thứ hiện ra đều lần về được sổ ghi việc</text><rect x="690" y="460" width="270" height="160" rx="10" fill="#fdf3e1" stroke="#333333" stroke-width="3"/><text x="825.0" y="496.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#1a1a1a">Thẻ cửa duyệt</text><text x="825.0" y="522.95" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">dừng lượt, hiện thẻ:</text><text x="825.0" y="548.95" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">làm gì · lên cái gì</text><text x="825.0" y="574.95" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">hậu quả · bản lùi?</text><text x="825.0" y="600.95" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#1a1a1a">→ Duyệt / Không</text><line x1="620" y1="540" x2="690" y2="540" stroke="#333333" stroke-width="3" marker-end="url(#ah)"/><text x="655" y="526" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#444" font-style="italic">có hậu</text><text x="655" y="570" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#444" font-style="italic">quả</text><text x="825" y="642" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#444" font-style="italic">một chữ “có” gõ trong ô chat</text><text x="825" y="666" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#444" font-style="italic">không mở được cửa</text><path d="M 60 840 L 30 840 L 30 390 L 60 390" fill="none" stroke="#333333" stroke-width="3" marker-end="url(#ah)"/><text x="22" y="625.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#444" font-style="italic">lặp</text><path d="M 620 990 L 985 990 L 985 420 L 620 420" fill="none" stroke="#333333" stroke-width="3" stroke-dasharray="10,8" marker-end="url(#ah)"/><text x="975" y="810" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" text-anchor="end" fill="#444" font-style="italic">chưa đạt →</text><text x="975" y="838" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" text-anchor="end" fill="#444" font-style="italic">thêm một vòng</text></svg>